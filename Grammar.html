  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ht:5px;border-radius:50%;background:var(--accent)}\n.topbar a.back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:4px 13px;transition:.2s;font-size:11.5px}\n.topbar a.back:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(200,168,75,.6)}\n/* header */\n.head{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 60%,var(--blue) 135%);border-bottom:3px solid var(--accent)}\n.head::before{content:\"\";position:absolute;inset:0;background:radial-gradient(circle at 88% -10%,rgba(74,123,200,.4),transparent 55%)}\n.head-inner{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:30px 24px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}\n.head img{width:52px;height:52px;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.3)}\n.head .kicker{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}\n.head h1{font-family:'Playfair Display',serif;color:#fff;font-weight:700;font-size:clamp(1.5rem,3.6vw,2.1rem);line-height:1.1}\n/* nav bar */\n.navbar{background:var(--surface);border-bottom:1px solid var(--border)}\n.navbar-inner{max-width:1040px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.crumb{font-size:12.5px;color:var(--muted);letter-spacing:.03em;margin-right:auto}\n.crumb b{color:var(--navy);font-weight:600}\n.btn{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--navy);border-radius:8px;padding:7px 15px;transition:.18s;line-height:1.3}\n.btn:hover{border-color:var(--blue);color:var(--blue-deep);background:#f7f9fd}\n.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}\n.btn.primary:hover{background:var(--blue-deep);border-color:var(--blue-deep);color:#fff}\n.btn.gold{background:var(--accent);border-color:var(--accent-deep);color:#2a2008;font-weight:600}\n.btn.gold:hover{background:var(--accent-deep);color:#fff}\n.btn.ghost{border-style:dashed;color:var(--muted);font-size:13px}\n.btn.big{font-size:17px;padding:13px 30px;border-radius:9px}\n/* main */\nmain{max-width:1040px;margin:0 auto;padding:34px 24px 70px}\n.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}\n/* home */\n.home{max-width:640px;margin:36px auto;text-align:center;padding:46px 34px}\n.home h2{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,4.4vw,2.4rem);color:var(--navy);line-height:1.15;letter-spacing:.01em}\n.home .rule{width:64px;height:3px;background:var(--accent);margin:20px auto 22px}\n.home p{color:var(--text);font-size:17px;max-width:460px;margin:0 auto 28px;text-wrap:pretty}\n.home .stats{margin-top:26px;font-size:13px;color:var(--muted);letter-spacing:.04em}\n/* menu */\n.secttitle{display:flex;align-items:baseline;gap:12px;margin:34px 0 14px;flex-wrap:wrap}\n.secttitle:first-child{margin-top:0}\n.secttitle h3{font-family:'Playfair Display',serif;font-size:1.18rem;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}\n.secttitle .bar{flex:1;height:1px;background:var(--border);min-width:20px}\n.secttitle .n{font-size:11.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}\n.topic{display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit;font-size:16px;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:9px;padding:12px 14px;transition:.18s;color:var(--text);line-height:1.35;width:100%}\n.topic:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--c)}\n.topic .let{flex-shrink:0;width:28px;height:28px;border-radius:7px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em;font-family:'Source Serif 4',serif}\n.topic .lbl{flex:1}\n.topic .badge{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.03em}\n.topic .badge .ok{color:var(--green);font-weight:700}\n.topic .badge .sc{font-variant-numeric:tabular-nums}\n/* panel */\n.panel{max-width:760px;margin:0 auto;padding:30px 34px 34px}\n.chosen{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}\n.panel h2{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,3.4vw,1.9rem);color:var(--navy);line-height:1.15;margin:6px 0 4px}\n.catline{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:700;margin-bottom:22px}\n.choices{display:grid;gap:10px;margin-top:8px}\n.choice{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;font-size:16.5px;cursor:pointer;background:#fbfaf7;border:1px solid var(--border);border-radius:9px;padding:15px 17px;transition:.18s;color:var(--text);width:100%}\n.choice:hover{background:#f7f9fd;border-color:var(--blue);box-shadow:var(--shadow)}\n.choice .let{flex-shrink:0;width:26px;height:26px;border-radius:6px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}\n/* fiche */\n.fiche{max-width:800px;margin:0 auto;padding:30px 34px 30px}\n.fiche .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--navy);color:#fff;border-radius:5px;padding:3px 10px;margin-bottom:14px}\n.fiche h2{font-family:'Playfair Display',serif;font-size:clamp(1.35rem,3.2vw,1.8rem);color:var(--navy);line-height:1.15;margin-bottom:18px}\n.fiche h4{font-family:'Playfair Display',serif;font-size:1.02rem;color:var(--navy);margin:22px 0 7px;letter-spacing:.02em}\n.fiche h4:first-of-type{margin-top:4px}\n.fiche p{margin:0 0 10px;text-wrap:pretty}\n.fiche ul{margin:0 0 10px 20px}\n.fiche li{margin-bottom:5px}\n.fiche em{color:var(--muted)}\n.fiche .en{font-style:italic;color:var(--blue-deep)}\n.fiche code,.struct{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;background:#f0eee8;border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--navy)}\n.struct{display:inline-block;padding:5px 11px;margin:2px 0}\n.fiche table{border-collapse:collapse;width:100%;margin:10px 0 14px;font-size:15px}\n.fiche th,.fiche td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}\n.fiche th{background:#f0eee8;font-weight:600;color:var(--navy);font-size:13px;letter-spacing:.04em;text-transform:uppercase}\n.warn{background:#faf6ec;border:1px solid var(--accent);border-radius:9px;padding:14px 17px;margin:14px 0}\n.warn .wh{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:6px}\n.warn ul{margin:0 0 0 18px}\n.no{color:var(--red)}\n.yes{color:var(--green)}\n.sep{height:1px;background:var(--border);margin:26px 0 20px}\n/* exercices */\n.ex{max-width:720px;margin:0 auto;padding:28px 34px 32px}\n.exhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}\n.exhead .th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700}\n.exhead .cnt{font-size:12.5px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}\n.bar{height:5px;background:#eae7df;border-radius:3px;overflow:hidden;margin:8px 0 24px}\n.bar i{display:block;height:100%;background:var(--c);transition:width .3s}\n.instr{font-size:13px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}\n.qtext{font-size:19px;line-height:1.6;margin-bottom:18px;text-wrap:pretty}\n.qtext b{color:var(--blue-deep);font-weight:600}\n.gap{display:inline-block;min-width:82px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent-deep)}\ninput[type=text]{font-family:inherit;font-size:17px;padding:11px 14px;border:1px solid var(--border);border-radius:8px;width:100%;background:#fbfaf7;color:var(--text)}\ninput[type=text]:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(45,95,166,.12)}\n.opts{display:grid;gap:9px}\n.opt{display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit;font-size:16.5px;cursor:pointer;background:#fbfaf7;border:1px solid var(--border);border-radius:8px;padding:12px 15px;transition:.15s;color:var(--text);width:100%}\n.opt:hover:not(:disabled){border-color:var(--blue);background:#f7f9fd}\n.opt .k{flex-shrink:0;width:24px;height:24px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}\n.opt.sel{border-color:var(--navy);background:#fff;box-shadow:0 0 0 2px rgba(26,39,68,.12)}\n.opt.sel .k{background:var(--navy);color:#fff;border-color:var(--navy)}\n.opt.good{border-color:var(--green);background:#eef7f1}\n.opt.good .k{background:var(--green);color:#fff;border-color:var(--green)}\n.opt.bad{border-color:var(--red);background:#fbeeed}\n.opt.bad .k{background:var(--red);color:#fff;border-color:var(--red)}\n.opt:disabled{cursor:default}\n.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}\n.fb{margin-top:20px;border-radius:9px;padding:15px 18px;border:1px solid;animation:pop .22s ease-out}\n@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.fb.ok{background:#eef7f1;border-color:var(--green)}\n.fb.ko{background:#fbeeed;border-color:var(--red)}\n.fb .verdict{font-weight:700;font-size:16px;letter-spacing:.02em;margin-bottom:6px;display:flex;align-items:center;gap:8px}\n.fb.ok .verdict{color:var(--green)}\n.fb.ko .verdict{color:var(--red)}\n.fb .sol{font-size:16px;margin-bottom:6px}\n.fb .sol i{color:var(--blue-deep)}\n.fb .why{font-size:15.5px;color:var(--text)}\n/* résultat */\n.res{max-width:600px;margin:0 auto;text-align:center;padding:40px 34px}\n.res .score{font-family:'Playfair Display',serif;font-size:3.4rem;line-height:1;color:var(--navy)}\n.res .score span{font-size:1.6rem;color:var(--muted)}\n.res .msg{margin:14px auto 6px;max-width:400px}\n.res .best{font-size:13px;color:var(--muted);letter-spacing:.05em;margin-top:8px}\n.res .actions{justify-content:center;margin-top:26px}\n.review{text-align:left;margin-top:30px;border-top:1px solid var(--border);padding-top:18px}\n.review h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}\n.review div{font-size:15px;padding:6px 0;border-bottom:1px dotted var(--border);display:flex;gap:10px}\n.review div:last-child{border:0}\n.review .m{flex-shrink:0;font-weight:700}\n/* footer */\nfooter{background:var(--navy-deep);color:rgba(255,255,255,.6);font-size:13px;padding:26px 24px;text-align:center}\nfooter .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}\nfooter img{width:30px;height:30px;border-radius:7px}\nfooter a{color:rgba(255,255,255,.8)}\n@media(max-width:640px){\n body{font-size:16px}\n main{padding:22px 14px 50px}\n .panel,.fiche,.ex,.res,.home{padding-left:18px;padding-right:18px}\n .head-inner{padding:22px 16px}\n .grid{grid-template-columns:1fr}\n .qtext{font-size:17.5px}\n .fiche table{font-size:14px}\n .fiche th,.fiche td{padding:6px 7px}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"topbar\"><div class=\"topbar-inner\"><span class=\"place\"><span class=\"dot\"><\u002Fspan>Lycée Sidoine Apollinaire · Clermont-Ferrand<\u002Fspan><a class=\"back\" href=\"index.html\">← Retour à l'accueil<\u002Fa><\u002Fdiv><\u002Fdiv>\n<header class=\"head\"><div class=\"head-inner\"><img src=\"40a78ad0-0755-4441-a00f-29b7fc00e311\" alt=\"Logo LSA\"><div><div class=\"kicker\">Anglais · Boîte à outils<\u002Fdiv><h1>Grammar Assistant — B2<\u002Fh1><\u002Fdiv><\u002Fdiv><\u002Fheader>\n<nav class=\"navbar\"><div class=\"navbar-inner\"><div class=\"crumb\" id=\"crumb\"><\u002Fdiv><div id=\"navbtns\" style=\"display:flex;gap:8px;flex-wrap:wrap\"><\u002Fdiv><\u002Fdiv><\u002Fnav>\n<main id=\"app\"><\u002Fmain>\n<footer><div class=\"in\"><img src=\"40a78ad0-0755-4441-a00f-29b7fc00e311\" alt=\"\"><span>LSA Toolbox · outils des étudiants de M. Blanchet · <a href=\"index.html\">accueil<\u002Fa><\u002Fspan><\u002Fdiv><\u002Ffooter>\n\n<script src=\"52031353-29c8-49a6-b140-9329c252c9ce\"><\u002Fscript>\n<script src=\"aedbd5a2-4a6f-4cf1-a738-0974ca574f92\"><\u002Fscript>\n<script src=\"43e6d4d9-dfc4-43f3-869f-03238b5c1c28\"><\u002Fscript>\n<script src=\"41d86945-4628-480d-bc09-6bdc317b1f2a\"><\u002Fscript>\n<script>\n/* ═══ DONNÉES ═══ */\nconst CATS=[\n {id:'verbe',name:'Autour du verbe',c:'#2d5fa6',topics:window.GRAM_VERBE},\n {id:'nom',name:'Autour du nom',c:'#2a7a4b',topics:window.GRAM_NOM},\n {id:'syntaxe',name:'Autour de la syntaxe',c:'#a9883a',topics:window.GRAM_SYNTAXE}\n];\nconst ALL={};CATS.forEach(c=>c.topics.forEach(t=>{t.cat=c;ALL[t.id]=t}));\nObject.keys(window.GRAM_GEN||{}).forEach(k=>{if(ALL[k])ALL[k].gen=window.GRAM_GEN[k]});\n\n/* ═══ PROGRESSION ═══ */\nconst KEY='lsa-grammar-b2';\nlet P={};\ntry{P=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){P={}}\nfunction save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}\nfunction rec(id,score,total){const p=P[id]||{done:0,best:0};p.done++;if(score>p.best)p.best=score;p.total=total;P[id]=p;save()}\n\n/* ═══ CORRECTION SOUPLE ═══ */\nfunction norm(s){return (s||'').toString().toLowerCase()\n .replace(/[’‘`´]/g,\"'\").replace(/[“”]/g,'\"')\n .replace(/\\s+/g,' ').trim()\n .replace(/[.!?;:,]+$/,'').trim()}\nfunction match(user,answers){const u=norm(user);if(!u)return false;\n return answers.some(a=>{const n=norm(a);return u===n||u===n.replace(/\\s/g,'')||u.replace(/\\s/g,'')===n.replace(/\\s/g,'')})}\n\n/* ═══ ÉTAT / ROUTAGE ═══ */\nlet S={screen:'home',topic:null,expIdx:0,qIdx:0,qs:[],score:0,log:[],sel:null,answered:false};\nconst app=document.getElementById('app');\nconst esc=s=>s.replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;');\nconst LET='abcdefghijklmnopqrstuvwxyz';\n\nfunction go(screen,opts={}){Object.assign(S,{screen},opts);window.scrollTo({top:0,behavior:'instant'});render()}\n\nfunction nav(){\n const c=document.getElementById('crumb'),b=document.getElementById('navbtns');\n const t=S.topic;\n let path='<b>Grammar Assistant<\u002Fb>';\n if(S.screen==='menu')path+=' · Menu grammatical';\n if(t){path+=' · '+t.cat.name+' · <b>'+t.letter+'. '+t.t+'<\u002Fb>';\n  if(S.screen==='exp')path+=' · Explication';\n  if(S.screen==='ex')path+=' · Exercices';\n  if(S.screen==='res')path+=' · Résultats'}\n c.innerHTML=path;\n let h='';\n if(S.screen!=='home')h+='<button class=\"btn\" onclick=\"go(\\'home\\')\">⌂ Accueil<\u002Fbutton>';\n if(S.screen!=='home'&&S.screen!=='menu')h+='<button class=\"btn\" onclick=\"go(\\'menu\\',{topic:null})\">Menu grammatical<\u002Fbutton>';\n if(S.screen==='exp'||S.screen==='ex'||S.screen==='res')h+='<button class=\"btn\" onclick=\"go(\\'topic\\')\">← Retour<\u002Fbutton>';\n b.innerHTML=h;\n}\n\nfunction render(){nav();({home:vHome,menu:vMenu,topic:vTopic,exp:vExp,ex:vEx,res:vRes})[S.screen]()}\n\n/* ═══ ACCUEIL ═══ */\nfunction vHome(){\n const worked=Object.keys(P).length;\n app.innerHTML=`<section class=\"card home\">\n  <h2>Grammar Assistant — B2<\u002Fh2><div class=\"rule\"><\u002Fdiv>\n  <p>Bienvenue dans ton assistant de grammaire anglaise. Choisis un point de grammaire, consulte les explications et entraîne-toi avec des exercices corrigés.<\u002Fp>\n  <button class=\"btn primary big\" onclick=\"go('menu',{topic:null})\">COMMENCER<\u002Fbutton>\n  <div class=\"stats\">${Object.keys(ALL).length} points de grammaire · 7 exercices par série${worked?' · déjà travaillé : '+worked+' thème'+(worked>1?'s':''):''}<\u002Fdiv>\n <\u002Fsection>`;\n}\n\n/* ═══ MENU ═══ */\nfunction vMenu(){\n let h='';\n CATS.forEach(c=>{\n  h+=`<div class=\"secttitle\"><h3 style=\"color:${c.c}\">${c.name}<\u002Fh3><span class=\"bar\"><\u002Fspan><span class=\"n\">${c.topics.length} points<\u002Fspan><\u002Fdiv><div class=\"grid\">`;\n  c.topics.forEach(t=>{\n   const p=P[t.id];\n   h+=`<button class=\"topic\" style=\"--c:${c.c}\" onclick=\"go('topic',{topic:ALL['${t.id}']})\">\n    <span class=\"let\">${t.letter}<\u002Fspan><span class=\"lbl\">${t.t}<\u002Fspan>\n    <span class=\"badge\">${p?`<span class=\"ok\">✓ travaillé<\u002Fspan><span class=\"sc\">meilleur : ${p.best}/${p.total||7}<\u002Fspan>`:''}<\u002Fspan><\u002Fbutton>`;\n  });\n  h+='<\u002Fdiv>';\n });\n h+=`<div style=\"margin-top:38px;text-align:center\"><button class=\"btn ghost\" onclick=\"reset()\">Réinitialiser ma progression<\u002Fbutton><\u002Fdiv>`;\n app.innerHTML=h;\n}\nfunction reset(){if(confirm(\"Réinitialiser ta progression ?\\n\\nLes thèmes travaillés et les meilleurs scores seront définitivement supprimés.\"))\n {P={};try{localStorage.removeItem(KEY)}catch(e){}render()}}\n\n/* ═══ THÈME ═══ */\nfunction vTopic(){\n const t=S.topic,p=P[t.id];\n app.innerHTML=`<section class=\"card panel\" style=\"--c:${t.cat.c}\">\n  <div class=\"chosen\">Tu as choisi<\u002Fdiv>\n  <h2>${t.t}<\u002Fh2><div class=\"catline\">${t.cat.name} · ${t.letter}<\u002Fdiv>\n  ${p?`<div style=\"font-size:13.5px;color:var(--muted);margin:-14px 0 20px\">Déjà travaillé : ✓ &nbsp;·&nbsp; Meilleur score : ${p.best}/${p.total||7} &nbsp;·&nbsp; ${p.done} série${p.done>1?'s':''} effectuée${p.done>1?'s':''}<\u002Fdiv>`:''}\n  <div class=\"choices\">\n   <button class=\"choice\" onclick=\"go('exp',{expIdx:0})\"><span class=\"let\">a<\u002Fspan>Voir l'explication<\u002Fbutton>\n   <button class=\"choice\" onclick=\"startEx()\"><span class=\"let\">b<\u002Fspan>Faire des exercices<\u002Fbutton>\n  <\u002Fdiv>\n  ${t.gen?'<div style=\"font-size:13px;color:var(--muted);margin-top:14px\">↻ Phrases générées : chaque série propose de nouveaux exemples.<\u002Fdiv>':''}\n  <div style=\"margin-top:24px\"><button class=\"btn ghost\" onclick=\"go('menu',{topic:null})\">← Retour au menu principal<\u002Fbutton><\u002Fdiv>\n <\u002Fsection>`;\n}\n\n/* ═══ EXPLICATION ═══ */\nfunction vExp(){\n const t=S.topic,i=Math.min(S.expIdx,t.exp.length-1),more=i<t.exp.length-1;\n app.innerHTML=`<section class=\"card fiche\" style=\"--c:${t.cat.c}\">\n  <span class=\"tag\" style=\"background:${t.cat.c}\">${i===0?'Fiche':'Autre explication'}<\u002Fspan>\n  <h2>${t.t}<\u002Fh2>\n  ${t.exp[i]}\n  <div class=\"sep\"><\u002Fdiv>\n  <div class=\"choices\">\n   ${more?`<button class=\"choice\" onclick=\"go('exp',{expIdx:${i+1}})\"><span class=\"let\">a<\u002Fspan>J'ai besoin de plus d'explications<\u002Fbutton>`:''}\n   <button class=\"choice\" onclick=\"startEx()\"><span class=\"let\">${more?'b':'a'}<\u002Fspan>Faire des exercices d'application<\u002Fbutton>\n   <button class=\"choice\" onclick=\"go('menu',{topic:null})\"><span class=\"let\">${more?'c':'b'}<\u002Fspan>Revenir au menu principal<\u002Fbutton>\n  <\u002Fdiv>\n <\u002Fsection>`;\n}\n\n/* ═══ EXERCICES ═══ */\nfunction startEx(){\n const t=S.topic;let qs=[];\n if(t.gen){const seen=new Set();let guard=0;\n  while(qs.length<7&&guard++<300){const q=t.gen();const k=q.q;if(seen.has(k))continue;seen.add(k);qs.push(q)}\n }else{\n  const idx=t.ex.map((_,i)=>i);\n  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}\n  qs=idx.slice(0,7).map(i=>t.ex[i]);\n }\n go('ex',{qs,qIdx:0,score:0,log:[],sel:null,answered:false});\n}\nfunction curQ(){return S.qs[S.qIdx]}\nconst KIND={fill:'Complète la phrase',mcq:'Choisis la bonne réponse',fix:'Corrige la phrase',trad:'Traduis en anglais'};\n\nfunction vEx(){\n const t=S.topic,q=curQ(),n=S.qs.length;\n let body='';\n if(q.type==='mcq'){\n  body='<div class=\"opts\">'+q.opts.map((o,i)=>`<button class=\"opt\" id=\"o${i}\" onclick=\"pick(${i})\"><span class=\"k\">${LET[i]}<\u002Fspan><span>${o}<\u002Fspan><\u002Fbutton>`).join('')+'<\u002Fdiv>';\n }else{\n  body=`<input type=\"text\" id=\"ans\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" placeholder=\"${q.type==='fix'?'Réécris la phrase corrigée':q.type==='trad'?'Ta traduction en anglais':'Ta réponse'}\">`;\n }\n app.innerHTML=`<section class=\"card ex\" style=\"--c:${t.cat.c}\">\n  <div class=\"exhead\"><span class=\"th\">${t.t}<\u002Fspan><span class=\"cnt\">Question ${S.qIdx+1} / ${n} · score ${S.score}<\u002Fspan><\u002Fdiv>\n  <div class=\"bar\"><i style=\"width:${S.qIdx/n*100}%\"><\u002Fi><\u002Fdiv>\n  ${/^(Remets|Mets|Réécris|Écris|Passif|Complète|Traduis|Corrige|Which|How|What)/.test(q.q.replace(/<[^>]+>/g,''))?'':`<div class=\"instr\">${KIND[q.type]||''}<\u002Fdiv>`}\n  <div class=\"qtext\">${q.q}<\u002Fdiv>\n  ${body}\n  <div id=\"fb\"><\u002Fdiv>\n  <div class=\"actions\" id=\"act\">${q.type==='mcq'?'<button class=\"btn primary\" id=\"val\" onclick=\"check()\" disabled>VALIDER<\u002Fbutton>':'<button class=\"btn primary\" id=\"val\" onclick=\"check()\">VALIDER<\u002Fbutton>'}\n   <button class=\"btn ghost\" onclick=\"go('menu',{topic:null})\">Quitter la série<\u002Fbutton><\u002Fdiv>\n <\u002Fsection>`;\n const inp=document.getElementById('ans');\n if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();S.answered?next():check()}})}\n}\nfunction pick(i){if(S.answered)return;S.sel=i;\n curQ().opts.forEach((_,k)=>document.getElementById('o'+k).classList.toggle('sel',k===i));\n document.getElementById('val').disabled=false}\n\nfunction check(){\n if(S.answered)return;\n const q=curQ();let ok,given;\n if(q.type==='mcq'){\n  if(S.sel===null)return;\n  given=q.opts[S.sel];ok=S.sel===q.correct;\n  q.opts.forEach((_,k)=>{const el=document.getElementById('o'+k);el.disabled=true;el.classList.remove('sel');\n   if(k===q.correct)el.classList.add('good');else if(k===S.sel)el.classList.add('bad')});\n }else{\n  const inp=document.getElementById('ans');given=inp.value;ok=match(given,q.a);\n  inp.disabled=true;inp.style.borderColor=ok?'var(--green)':'var(--red)';inp.style.background=ok?'#eef7f1':'#fbeeed';\n }\n S.answered=true;if(ok)S.score++;\n const sol=q.type==='mcq'?q.opts[q.correct]:q.a[0];\n S.log.push({ok,q:q.q,sol});\n document.getElementById('fb').innerHTML=`<div class=\"fb ${ok?'ok':'ko'}\">\n  <div class=\"verdict\">${ok?'✓ Correct !':'✗ Faux'}<\u002Fdiv>\n  ${ok?'':`<div class=\"sol\">Bonne réponse : <i>${sol}<\u002Fi><\u002Fdiv>`}\n  <div class=\"why\">${q.fb}<\u002Fdiv><\u002Fdiv>`;\n const last=S.qIdx===S.qs.length-1;\n document.getElementById('act').innerHTML=`<button class=\"btn gold\" onclick=\"next()\">${last?'Voir mon score':'Question suivante →'}<\u002Fbutton>\n  <button class=\"btn ghost\" onclick=\"go('menu',{topic:null})\">Quitter la série<\u002Fbutton>`;\n}\nfunction next(){\n if(S.qIdx===S.qs.length-1){rec(S.topic.id,S.score,S.qs.length);go('res')}\n else go('ex',{qIdx:S.qIdx+1,sel:null,answered:false});\n}\n\n/* ═══ RÉSULTAT ═══ */\nfunction vRes(){\n const t=S.topic,n=S.qs.length,p=P[t.id]||{};\n const msg=S.score===n?\"Parfait. Ce point est acquis.\":S.score>=n-2?\"Bon travail. Revois les deux ou trois points manqués.\":\"À retravailler : relis la fiche puis refais une série.\";\n app.innerHTML=`<section class=\"card res\" style=\"--c:${t.cat.c}\">\n  <div class=\"score\">${S.score}<span>/${n}<\u002Fspan><\u002Fdiv>\n  <div class=\"msg\">${msg}<\u002Fdiv>\n  <div class=\"best\">${t.t} · meilleur score : ${p.best}/${n} · ${p.done} série${p.done>1?'s':''}<\u002Fdiv>\n  <div class=\"actions\">\n   <button class=\"btn primary\" onclick=\"startEx()\">Refaire une série<\u002Fbutton>\n   <button class=\"btn\" onclick=\"go('exp',{expIdx:0})\">Relire la fiche<\u002Fbutton>\n   <button class=\"btn\" onclick=\"go('menu',{topic:null})\">Menu grammatical<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"review\"><h4>Récapitulatif<\u002Fh4>${S.log.map(l=>`<div><span class=\"m ${l.ok?'yes':'no'}\">${l.ok?'✓':'✗'}<\u002Fspan><span>${l.ok?'':'<i>'+l.sol+'<\u002Fi> — '}${l.q.replace(/<[^>]+>/g,'')}<\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv>\n <\u002Fsection>`;\n}\nrender();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
